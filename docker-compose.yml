services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nominahub}
      POSTGRES_USER: ${POSTGRES_USER:-nominahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nominahub_dev}
    ports:
      - "5432:5432"
    volumes:
      - nominahub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nominahub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://nominahub:nominahub_dev@db:5432/nominahub}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  nominahub_pgdata:
